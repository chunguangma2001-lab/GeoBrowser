<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>光光浏览器</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;display:flex;flex-direction:column;min-height:100vh}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
h1{font-size:28px;margin:0 0 8px}
p{color:#64748b;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:360px}
a{display:block;background:#fff;border-radius:12px;padding:16px;text-decoration:none;color:#0f172a;box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:500}
a:active{background:#f1f5f9}
</style>
</head>
<body>
<div class="wrap">
<div><h1>光光浏览器</h1><p>点右上角定位按钮，控制网页拿到的位置</p></div>
<div class="grid">
<a href="https://www.baidu.com">百度</a>
<a href="https://www.google.com">Google</a>
<a href="https://www.amap.com">高德地图</a>
<a href="https://map.baidu.com">百度地图</a>
</div>
</div>
</body>
</html>
